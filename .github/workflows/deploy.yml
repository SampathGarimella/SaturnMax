name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get yarn cache directory
        id: yarn-cache
        working-directory: frontend
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn deps (best-effort)
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --network-timeout 600000

      - name: Build React app
        env:
          # Firebase web config — paste each value as a repo secret.
          # These are *safe* to expose in the built bundle; Firebase security
          # is enforced by Firestore / Storage rules, not by hiding the key.
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_BRAND_NAME: ${{ vars.REACT_APP_BRAND_NAME || 'Company' }}
	  REACT_APP_LEGAL_NAME: ${{ vars.REACT_APP_LEGAL_NAME || 'Company Private Limited' }}
          REACT_APP_PUBLIC_DOMAIN: ${{ vars.REACT_APP_PUBLIC_DOMAIN || 'example.com' }}
          REACT_APP_APP_BASE_URL: ${{ vars.REACT_APP_APP_BASE_URL || 'https://example.com' }}
          REACT_APP_SUPPORT_EMAIL: ${{ vars.REACT_APP_SUPPORT_EMAIL || 'support@example.com' }}
          REACT_APP_HR_EMAIL: ${{ vars.REACT_APP_HR_EMAIL || 'hr@example.com' }}
          REACT_APP_LINKEDIN_URL: ${{ vars.REACT_APP_LINKEDIN_URL || 'https://www.linkedin.com/company/example/' }}

          CI: "false" # CRA treats warnings as errors in CI — silence that.
        run: yarn build

      - name: Generate custom domain file
	working-directory: frontend
        run: |
          if [ -n "${{ vars.REACT_APP_PUBLIC_DOMAIN }}" ]; then
            printf "%s\n" "${{ vars.REACT_APP_PUBLIC_DOMAIN }}" > build/CNAME
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
