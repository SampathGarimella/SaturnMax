<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaturnMax</title>
  <meta name="description" content="SaturnMax — Coming Soon" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <script src="feature-flags.js"></script>
</head>
<body>

  <!-- ===== UNDER CONSTRUCTION (default) ===== -->
  <div id="under-construction" class="uc-page">
    <div class="uc-inner">
      <div class="uc-logo">
        <span class="logo-sa">SA</span><span class="logo-turn"> Turn</span><span class="logo-max"> Max</span>
      </div>
      <div class="uc-icon">&#9881;</div>
      <h1>We're Building Something Great</h1>
      <p>Our website is under construction. We'll be launching soon.</p>
      <p class="uc-contact">Reach us at <a href="mailto:hello@saturnmax.com">hello@saturnmax.com</a></p>
    </div>
  </div>

  <!-- ===== FULL SITE (enabled via feature flag) ===== -->
  <div id="full-site">
    <!-- Full website content goes here when WEBSITE_LIVE = true -->
  </div>

  <script>
    if (FEATURE_FLAGS.WEBSITE_LIVE) {
      document.getElementById('under-construction').style.display = 'none';
      document.getElementById('full-site').style.display = 'block';
    }
  </script>

</body>
</html>
